name: Daily Event Reminders

# Emails a user about events THEY saved that are about to happen.
#
# WHY THIS IS ITS OWN WORKFLOW rather than a step in daily-digest.yml: the two have different
# failure meanings and must not share an exit code. The digest is a nice-to-have that skips
# silently when unconfigured; a reminder that fails is a promise broken to somebody who saved an
# event, and it exits 1 so the run goes red. Sharing a job would make one of those wrong.
#
# It runs like the other two crons — directly on the runner via `tsx`, NOT by calling an API route.
# Same reasoning as daily-scrape.yml and daily-digest.yml (see vercel.json's notes in CLAUDE.md):
# no shared secret to leak, and no serverless timeout to fight.
#
# SAFE TO RE-RUN AND SAFE TO OVERLAP. `scripts/send-reminders.ts` is idempotent — every event
# already mailed carries a ReminderLog row, and the unique index means even two simultaneous runs
# cannot both send. So a manual `workflow_dispatch` next to the schedule is harmless, which is what
# makes it usable for a real test.

on:
  # 07:00 IST (01:30 UTC) — an hour before the scrape and the digest, deliberately. A reminder is
  # about something the user already saved, so it does not need this morning's new events, and
  # arriving first means it is not buried under the digest in the inbox.
  schedule:
    - cron: '30 1 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and report only — write nothing, send nothing'
        type: boolean
        default: true
      only_email:
        description: 'Restrict the run to one address (optional)'
        type: string
        required: false

# One reminder run at a time. Two concurrent runs cannot double-send (the unique index prevents
# it), but they would race for the daily cap and make the logs hard to read.
concurrency:
  group: daily-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same guard as daily-digest.yml, for the same measured reason and the same two secrets:
      # `sendEventReminders()` preflights RESEND_API_KEY and NEXTAUTH_SECRET and returns BEFORE
      # `connectDB()`, so `scripts/send-reminders.ts` exits 0 and the run is green. Measured: all 8
      # scheduled runs from 2026-09-12 to 09-19 succeeded, each spending 1-2 SECONDS in this step,
      # with `reminderlogs` holding 0 rows — and the log row is CLAIMED BEFORE the send, so zero rows
      # proves no send was ever attempted rather than that sends failed.
      #
      # Two independent senders sharing exactly these two variables, both green, both with no rows, is
      # what makes a missing shared secret the explanation rather than a per-sender bug.
      - name: Verify the email secrets are set
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          missing=0
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY repository secret is not set — no reminder can be sent."
            missing=1
          fi
          # Same URL-in-the-secret-slot check as daily-digest.yml, for the same reason: it was pasted
          # for real, and a URL is a public value being used as the key that signs session JWTs.
          case "$NEXTAUTH_SECRET" in
            http://*|https://*)
              echo "::error::NEXTAUTH_SECRET looks like a URL. That is NEXTAUTH_URL's value."
              echo "::error::Generate a real one with: openssl rand -base64 32 (same value in Vercel)."
              missing=1
              ;;
          esac
          if [ -z "$NEXTAUTH_SECRET" ]; then
            echo "::error::NEXTAUTH_SECRET repository secret is not set — it signs the unsubscribe link."
            echo "::error::It MUST be byte-identical to the value in Vercel, which verifies the HMAC."
            missing=1
          fi
          # Fatal for the same reason as the digest: `reminders.ts` falls back to localhost, so the
          # run would succeed and deliver mail whose every link points at the reader's own machine.
          if [ -z "$NEXTAUTH_URL" ]; then
            echo "::error::NEXTAUTH_URL repository secret is not set — every link would be localhost."
            echo "::error::Set it to the deployed origin, e.g. https://pulseblr-u9f1.vercel.app"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add them under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "$EMAIL_FROM" ]; then
            echo "::warning::EMAIL_FROM is not set — falling back to Resend's shared sender, which a"
            echo "::warning::verified domain will reject with a 403 and leave the ReminderLog row 'failed'."
          fi
          echo "Email secrets present ✓"

      - name: Send event reminders
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Signs the unsubscribe link. Without it the script refuses to send anything at all —
          # an email nobody can get off is worse than no email.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # Every link in the email, including the unsubscribe one, is built from this. A missing
          # value means localhost URLs in somebody's inbox.
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: >-
          npx tsx scripts/send-reminders.ts
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}
          ${{ inputs.only_email && format('--only={0}', inputs.only_email) || '' }}
