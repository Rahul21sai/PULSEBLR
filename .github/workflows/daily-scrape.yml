name: Daily Event Scraper

on:
  # Run daily at 8 AM IST (2:30 AM UTC)
  schedule:
    - cron: '30 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full run fans out to ~700 upstream requests plus batched LLM tagging and
    # takes roughly 5-10 minutes. The cap stops a hung upstream host from holding
    # a runner for the default six hours.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # Fail fast with a CLEAR message if the DB secret is missing. Without this,
      # the scraper falls back to mongodb://localhost:27017 (no server in CI) and
      # dies with a confusing ~30s connection timeout deep in the run.
      - name: Verify MONGODB_URI secret is set
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI repository secret is not set. Add it under"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "MONGODB_URI is set ✓"

      - name: Run scrapers
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Optional LLM tagging — the tagger cascades ICA → NVIDIA → Anthropic →
          # keyword fallback, so any unset key is simply skipped (no failure).
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          ICA_BASE_URL: ${{ secrets.ICA_BASE_URL }}
          ICA_MODEL: ${{ secrets.ICA_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run scrape
      
      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7

