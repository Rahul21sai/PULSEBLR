name: Daily Event Scraper

on:
  # Run daily at 8 AM IST (2:30 AM UTC)
  schedule:
    - cron: '30 2 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full run fans out to ~700 upstream requests plus batched LLM tagging and
    # takes roughly 5-10 minutes. The cap stops a hung upstream host from holding
    # a runner for the default six hours.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # ── The headless-browser FALLBACK for Meetup's 10-event ICS cap ──────────────────────────
      #
      # Meetup's per-group ICS feed returns at most 10 upcoming events. 74 of 261 stored groups
      # were sitting on that ceiling, hiding roughly 550 events. The fix is a second pass over the
      # group's `/events/` page, and that page needs NO browser: the events are server-rendered
      # into `__NEXT_DATA__` and a plain fetch reads them in ~1 s. That second pass is on by
      # default and costs nothing here.
      #
      # `--render` below arms a browser FALLBACK for the day Meetup stops server-rendering that
      # data island — the difference between a degraded source and a dead one. It is armed HERE
      # and nowhere else because a GitHub runner can carry a browser and the app's other caller of
      # the pipeline (`POST /api/scrape`) is a Vercel function, which cannot. See
      # docs/superpowers/specs/2026-09-09-system-architecture.md §2.
      #
      # Chromium is CACHED, because downloading ~170 MB nightly for a path that currently never
      # fires is not a cost worth paying, and `continue-on-error` because it is a fallback: a
      # failed browser install must degrade the run, not fail it. `lib/scrapers/core/render.ts`
      # remembers a launch failure once and returns no events rather than throwing.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium for the render fallback
        continue-on-error: true
        run: npx playwright install chromium

      # Fail fast with a CLEAR message if the DB secret is missing. Without this,
      # the scraper falls back to mongodb://localhost:27017 (no server in CI) and
      # dies with a confusing ~30s connection timeout deep in the run.
      - name: Verify MONGODB_URI secret is set
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI repository secret is not set. Add it under"
            echo "::error::Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "MONGODB_URI is set ✓"

      - name: Run scrapers
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Optional LLM tagging — the tagger cascades ICA → NVIDIA → Anthropic →
          # keyword fallback, so any unset key is simply skipped (no failure).
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          ICA_API_KEY: ${{ secrets.ICA_API_KEY }}
          ICA_BASE_URL: ${{ secrets.ICA_BASE_URL }}
          ICA_MODEL: ${{ secrets.ICA_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # `--render` arms the browser fallback described above. The Meetup second pass itself is on
        # by default and does not depend on it.
        run: npm run scrape -- --render
      
      - name: Upload scraper logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7

