name: Daily Digest Email

# Sends the digest to the people whose STORED CADENCE says today.
#
# THE CRON RUNS EVERY MORNING AND THAT IS CORRECT EVEN THOUGH THE DEFAULT CADENCE IS WEEKLY.
# `digestDecision()` in lib/notifications/digest-schedule.ts decides who is due: a weekly subscriber
# is due only on Monday in IST, a daily one every day, and `off` never. Putting the cadence in the
# schedule instead would need two workflows and would turn "who is due" into a scheduling question
# rather than a preference one — and a user switching from weekly to daily would then have to wait for
# a deploy.
#
# It runs like the other three crons — directly on the runner via `tsx`, NOT by calling an API route.
# Same reasoning as daily-scrape.yml and daily-reminders.yml: no shared secret to leak, and no
# serverless timeout to fight.
#
# SAFE TO RE-RUN AND SAFE TO OVERLAP. `scripts/send-digest.ts` is idempotent — every digest already
# mailed carries a DigestLog row keyed { userId, kind, periodKey }, and the unique index means even two
# simultaneous runs cannot both send. So a manual `workflow_dispatch` next to the schedule is harmless,
# which is what makes it usable for a real test.

on:
  # 8 AM IST (02:30 UTC). An hour AFTER daily-reminders.yml, deliberately: a reminder is about
  # something the reader already saved and is time-critical, so it should not arrive underneath a
  # digest in the inbox.
  schedule:
    - cron: '30 2 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and report only — write nothing, send nothing'
        type: boolean
        default: true
      only_email:
        description: 'Restrict the run to one address (optional)'
        type: string
        required: false

# One digest run at a time. Two concurrent runs cannot double-send (the unique index prevents it), but
# they would race for the per-IST-day cap and make the logs hard to read.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── WHY THIS STEP EXISTS: NINE GREEN MORNINGS THAT SENT NOTHING. ────────────────────────────
      #
      # `sendScheduledDigests()` preflights RESEND_API_KEY and NEXTAUTH_SECRET and RETURNS BEFORE
      # `connectDB()`, and `scripts/send-digest.ts` then exits 0 — deliberately, because a repo that
      # has never configured email should not have a red cron every day. The cost of that choice is
      # that an unset secret is indistinguishable from a quiet morning: measured, every scheduled run
      # from 2026-09-12 onward reported SUCCESS while `digestlogs` held 0 rows and the send step took
      # 1-2 SECONDS, which is less than an Atlas TLS handshake. Monday 2026-09-14 a real subscriber
      # was due and got nothing, green.
      #
      # `daily-scrape.yml` already had exactly this guard for MONGODB_URI and is the reason the
      # scraper's failures were never silent. It was simply never copied to the two workflows that
      # send email — the ones where silence is the failure mode.
      #
      # Deliberately `exit 1`, not `::warning::`: a warning is scrollable, and this went unnoticed for
      # nine days. Once someone IS opted in, "could not send" must be louder than "nothing to send".
      - name: Verify the email secrets are set
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          missing=0
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY repository secret is not set — no digest can be sent."
            missing=1
          fi
          # NEXTAUTH_SECRET and NEXTAUTH_URL ARE EASY TO SWAP, AND ONE OF THOSE MISTAKES IS SILENT
          # AND SEVERE. This check exists because it was made for real: the deployment URL was pasted
          # into NEXTAUTH_SECRET. A URL is public and guessable, and this variable is an HMAC key that
          # also signs the Auth.js session JWT — so a URL-shaped value there means anyone who knows
          # the site address can forge a session cookie, not merely an unsubscribe token. Nothing in
          # the app would have complained: the HMAC computes fine with a weak key.
          case "$NEXTAUTH_SECRET" in
            http://*|https://*)
              echo "::error::NEXTAUTH_SECRET looks like a URL. That is NEXTAUTH_URL's value."
              echo "::error::NEXTAUTH_SECRET is an HMAC key and must be high-entropy random — it signs"
              echo "::error::the session JWT, so a public value means forgeable sessions. Generate one"
              echo "::error::with: openssl rand -base64 32   (and set the SAME value in Vercel)."
              missing=1
              ;;
          esac
          if [ -z "$NEXTAUTH_SECRET" ]; then
            echo "::error::NEXTAUTH_SECRET repository secret is not set — it signs the unsubscribe link,"
            echo "::error::and the sender refuses to mail anything without a working way off the list."
            echo "::error::It MUST be byte-identical to the value in Vercel: the runner signs the HMAC"
            echo "::error::and Vercel verifies it, so a fresh value ships dead unsubscribe links."
            missing=1
          fi
          # FATAL, and the reasoning differs from the two above. A missing RESEND_API_KEY or
          # NEXTAUTH_SECRET means the sender returns early and mails NOTHING, so failing here costs
          # nothing. A missing NEXTAUTH_URL is worse than that: `digest.ts` falls back to
          # `http://localhost:3000`, so the run SUCCEEDS and delivers a real email in which every
          # link — including the unsubscribe one — points at the reader's own machine. An email that
          # cannot be acted on is not a working email, and this is the failure this whole change set
          # exists to stop being silent.
          if [ -z "$NEXTAUTH_URL" ]; then
            echo "::error::NEXTAUTH_URL repository secret is not set. Without it every link in the"
            echo "::error::digest is built from http://localhost:3000 — the mail sends and is useless."
            echo "::error::Set it to the deployed origin, e.g. https://pulseblr-u9f1.vercel.app"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::error::Add them under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          # NOT fatal: lib/notifications/email.ts falls back to Resend's onboarding@resend.dev, which
          # works for a test and is rejected for a real domain. Worth saying out loud, not worth
          # blocking a send that may well be going to the operator's own inbox.
          if [ -z "$EMAIL_FROM" ]; then
            echo "::warning::EMAIL_FROM is not set — falling back to Resend's shared sender. Expect a"
            echo "::warning::403 from Resend unless your domain is verified, which marks the DigestLog"
            echo "::warning::row 'failed' and needs a --retry-failed dispatch to clear."
          fi
          echo "Email secrets present ✓"

      - name: Send the digest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Signs the unsubscribe link. Without it the script refuses to send anything at all — an
          # email nobody can get off is worse than no email.
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # Every link in the email, including the unsubscribe one, is built from this. A missing
          # value means localhost URLs in somebody's inbox.
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # USER_EMAIL IS DELIBERATELY ABSENT. The old sender mailed that one hardcoded address every
          # morning regardless of anybody's preference; recipients now come from the User collection
          # and their own stored cadence. Use the `only_email` input above to restrict a run.
        run: >-
          npx tsx scripts/send-digest.ts
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry' || '' }}
          ${{ inputs.only_email && format('--only={0}', inputs.only_email) || '' }}
